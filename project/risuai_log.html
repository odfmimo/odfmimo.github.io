<!DOCTYPE html>
<html>
    <head>
        <style>
            textarea { width: 100%; height: 20em; }
        </style>
    </head>
    <body>
        <textarea id="input_textarea"></textarea>
        <div id="output_div"></div>
        <script>
            document.querySelector("#input_textarea").addEventListener("change", _ => {
                document.querySelector("#output_div").innerHTML = "";
                JSON.parse(document.querySelector("#input_textarea").value).messages?.forEach(message => {
                    const content = message.content;
                    if (content) {
                        const contentTextarea = document.createElement("textarea");
                        contentTextarea.value = content;
                        document.querySelector("#output_div").appendChild(contentTextarea);
                    }
                });
            });
        </script>
    </body>
</html>
