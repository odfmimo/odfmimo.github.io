<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div id="app" class="container">
        <div class="d-flex flex-column gap-1 overflow-x-hidden">
            <div class="d-flex flex-row flex-wrap gap-3" style="row-gap: 0.25rem !important;">
                <div>
                    <input type="search" class="form-control" style="width: 15em;" v-model="searchInput">
                </div>
                <div class="flex-grow-1 d-flex flex-row">
                    <div class="d-flex flex-row gap-1">
                        <label v-for="availability in availabilites" class="btn btn-outline-primary" :class="{ active: checkedAvailability == availability }"> 
                            <input type="checkbox" class="btn-check" :true-value="availability" :false-value="undefined" v-model="checkedAvailability">{{availability}} 
                        </label>
                    </div>
                    <div class="ms-auto">
                        <button class="btn btn-primary" @click="clearSelectedChars">Clear</button>
                    </div>
                </div>
            </div>
            <div class="d-grid overflow-x-hidden overflow-y-scroll p-2 gap-2" style="grid-template-columns: repeat(auto-fill, 75px); place-content: start space-between; place-items: center; height: 260px;">
                <div v-for="char in filteredCharData.toReversed()">
                    <char-icon :char="char"></char-icon>
                </div>
            </div>
        </div>
        <div class="overflow-x-hidden">
            <div :style="isCardView ? { visibility: 'hidden', height: 0, overflow: 'hidden' } : { }" ref="listDiv">
                <div class="list-group list-group-flush">
                    <div v-for="[key, gachas] in filteredMappedGachaData.toReversed()" class="list-group-item">
                        <div>
                            <div><h5>{{key.nameEn}}</h5></div>
                            <div class="d-flex flex-row gap-1">
                                <div class="flex-shrink-0" style="width: 400px; max-width: 100%;">
                                    <img class="object-fit-contain w-100 h-100" :src="key.imgSrc">
                                </div>
                                <div class="flex-shrink-0 d-flex flex-column justify-content-center" style="width: 20em;">
                                    <div v-for="gacha in gachas">
                                        <span class="badge" :class="[gacha.revival ? 'text-bg-secondary' : 'text-bg-primary']" style="width: 5em;">{{gacha.revival ? "Revival" : "New"}}</span> {{gacha.start}} - {{gacha.end}}
                                    </div>
                                </div>
                                <div class="d-flex flex-row align-items-center flex-wrap align-content-center gap-1">
                                    <div v-for="char in key.pickUp" class="flex-shrink-0">
                                        <char-icon :char="char"></char-icon>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div v-if="isCardView">
                <div class="d-grid overflow-x-hidden p-2 gap-2" style="grid-template-columns: repeat(auto-fill, minmax(min(100%, max(400px, 20em)), 1fr)); place-content: start space-between; place-items: stretch center;">
                    <div v-for="[key, gachas] in filteredMappedGachaData.toReversed()" class="card" style="width: min(100%, max(400px, 20em));">
                        <img class="card-img-top" :src="key.imgSrc" style="max-width: 100%;">
                        <div class="card-body">
                            <div class="d-flex flex-column gap-1">
                                <h5 class="card-title">{{key.nameEn}}</h5>
                                <div class="flex-shrink-0 d-flex flex-column justify-content-center" style="width: 20em;">
                                    <div v-for="gacha in gachas">
                                        <span class="badge" :class="[gacha.revival ? 'text-bg-secondary' : 'text-bg-primary']" style="width: 5em;">{{gacha.revival ? "Revival" : "New"}}</span> {{gacha.start}} - {{gacha.end}}
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div class="card-footer bg-transparent">
                            <div class="d-flex flex-row align-items-center flex-wrap align-content-center gap-1">
                                <div v-for="char in key.pickUp" class="flex-shrink-0">
                                    <char-icon :char="char"></char-icon>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <template id="char-icon-template">
        <div class="d-flex align-items-center">
            <div class="position-relative" :class="{ 'opacity-50': !isSelected }" style="padding: 5px;" @click="toggleSelectedChars" :title="char.nameEn">
                <img class="object-fit-contain w-100 h-100" :src="imgSrc">
                <span class="position-absolute top-0 start-0 badge" style="font-size: 8px;" :style="`background-color: ${backgroundColor};`">☆{{char.rarity}}</span>
                <span v-if="char.limited" class="position-absolute bottom-0 end-0 badge text-bg-danger" style="font-size: 8px;">Limited</span>
            </div>
        </div>
    </template>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5/dist/js/bootstrap.bundle.min.js"></script>
<script type="module">
    import { createApp, ref, shallowRef, useTemplateRef, onMounted, onUpdated, computed, watch, provide, inject } from 'https://unpkg.com/vue@3/dist/vue.esm-browser.js'
    import * as yaml from 'https://cdn.jsdelivr.net/npm/js-yaml@5/+esm'
    import { kuromoji } from "https://code4fukui.github.io/kuromoji-es/kuromoji.js";

    const GACHA_URL = 'https://raw.githubusercontent.com/chira2chira/anados-checker/master/assets/gacha.yaml';
    const CHAR_URL = 'https://raw.githubusercontent.com/chira2chira/anados-checker/master/assets/charactor.yaml';

    const BANNER_IMG_DIR = 'https://raw.githubusercontent.com/chira2chira/anados-checker/master/public/static/image/banner/en/main/';
    const CHAR_IMG_DIR = 'https://raw.githubusercontent.com/chira2chira/anados-checker/master/public/static/image/char/';

    createApp({
        setup() {
            const gachaData = ref([])
            const charData = ref([])

            const selectedChars = ref(new Set())

            const searchInput = ref()
            const availabilites = ["Limited", "Standard"]
            const checkedAvailability = ref()

            const isCardView = ref()

            const tokenizer = shallowRef()
            
            provide('selectedChars', selectedChars)

            onMounted(async () => {
                charData.value = yaml.load(await (await fetch(CHAR_URL)).text())
                gachaData.value = yaml.load(await (await fetch(GACHA_URL)).text())
                tokenizer.value = await kuromoji.createTokenizer()
            })

            const mappedGachaData = computed(() => {
                let mappedGachaData = gachaData.value
                mappedGachaData = mappedGachaData.reduce((mappedGachaData, gacha) => {
                    const { nameEn } = gacha
                    const nameJa = tokenizer.value ? tokenizer.value.tokenize(gacha.nameJa).map(token => token.reading || token.surface_form).join("") : gacha.nameJa
                    const pickUp = gacha.pickUp.map(pickUp => charData.value.find(char => char.nameJa == pickUp.name) ?? { nameJa: pickUp.name })
                    const imgSrc = new URL(gacha.id + '.webp', BANNER_IMG_DIR)

                    const found = mappedGachaData.find(([key, _]) => {
                        return key.nameEn == nameEn && key.nameJa == nameJa && 
                            key.pickUp.every(char => pickUp.map(char => char.nameJa).includes(char.nameJa)) &&
                            pickUp.every(char => key.pickUp.map(char => char.nameJa).includes(char.nameJa)) 
                    })
                    if (found) {
                        const [key, gachas] = found
                        key.imgSrc = imgSrc
                        gachas.push(gacha)
                    }
                    else mappedGachaData.push([{ nameEn, nameJa, pickUp, imgSrc }, [gacha]])
                    return mappedGachaData
                }, [])
                return mappedGachaData
            })

            const filteredCharData = computed(() => {
                let filteredCharData = charData.value

                if (searchInput.value) filteredCharData = filteredCharData.filter(char => char.nameJa.toLowerCase().includes(searchInput.value?.toLowerCase()) || char.nameEn.toLowerCase().includes(searchInput.value?.toLowerCase()))
                if (checkedAvailability.value) {
                    switch(checkedAvailability.value) {
                        case "Limited":
                            filteredCharData = filteredCharData.filter(char => char.limited)
                            break
                        case "Standard":
                            filteredCharData = filteredCharData.filter(char => !char.limited)
                            break
                    }
                }
                return filteredCharData
            })
            const filteredMappedGachaData = computed(() => {
                let filteredMappedGachaData = mappedGachaData.value
                
                if (selectedChars.value.size > 0) {
                    filteredMappedGachaData = filteredMappedGachaData.filter(([key, _]) => key.pickUp.some(char => [...selectedChars.value].find(char_ => char.nameJa == char_.nameJa)))
                }
                return filteredMappedGachaData
            })

            function clearSelectedChars() {
                selectedChars.value.clear()
            }

            const listDiv = useTemplateRef('listDiv')
            onMounted(() => {
                const resizeObserver = new ResizeObserver(([entry, _]) => {
                    if (entry.target.scrollWidth > entry.target.offsetWidth) {
                        isCardView.value = true
                    }
                    else  isCardView.value = false
                })
                resizeObserver.observe(listDiv.value);
            })

            return {
                gachaData, charData, filteredCharData, filteredMappedGachaData, searchInput, availabilites, checkedAvailability, isCardView,
                clearSelectedChars
            }
        }
    }).component('CharIcon', {
        props: ['char'],
        setup(props) {
            const char = computed(() => props.char)

            const selectedChars = inject('selectedChars')
            const imgSrc = computed(() => new URL(char.value.image, CHAR_IMG_DIR))
            const backgroundColor = computed(() => char.value.rarity == 6 ? "#fd7e14" : char.value.rarity == 5 ? "#ffc107" : char.value.rarity == 4 ? "#0d6efd" : char.value.rarity == 3 ? "#0dcaf0" : "#adb5bd")
            const isSelected = computed(() => selectedChars.value.size == 0 || selectedChars.value.has(char.value))
            function toggleSelectedChars(event) {
                if (selectedChars.value.has(char.value)) selectedChars.value.delete(char.value)
                else selectedChars.value.add(char.value)
            }
            return {
                imgSrc, isSelected, backgroundColor,
                toggleSelectedChars
            }
        },
        template: document.getElementById("char-icon-template")
    }).mount('#app')
</script>
</body>
</html>
